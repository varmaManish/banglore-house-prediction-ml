<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bangalore House Price Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: auto;
      background-color: #f5f5f5;
    }

    h2 {
      color: #333;
      text-align: center;
    }

    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    input[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    .result {
      background: #e6ffe6;
      padding: 15px;
      margin-top: 20px;
      border-radius: 5px;
      font-size: 18px;
      color: #155724;
    }
  </style>
</head>
<body>
  <h2>Bangalore House Price Prediction</h2>
  <form method="POST" action="/predict">
    <label for="location">Location:</label>
    <select name="location" required>
      <option disabled selected value="">-- Select Location --</option>
      {% for loc in locations %}
        <option value="{{ loc }}">{{ loc }}</option>
      {% endfor %}
    </select>

    <label for="sqft">Total Sqft:</label>
    <input type="number" name="sqft" required>

    <label for="bath">Number of Bathrooms:</label>
    <input type="number" name="bath" required>

    <label for="bhk">Number of Bedrooms (BHK):</label>
    <input type="number" name="bhk" required>

    <input type="submit" value="Predict Price">
  </form>

  {% if prediction_text %}
    <div class="result">
      <p><strong>{{ prediction_text }}</strong></p>
      <p>{{ location_text }}</p>
    </div>
  {% endif %}
</body>
</html>
